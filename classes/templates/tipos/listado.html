
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tipos de Servicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div th:replace="~{plantilla :: header}"></div>
    <div th:replace="~{plantilla :: navbar}"></div>

    <main class="container mt-5">

        <h2 class="text-success mb-4">
            Tipos de Servicio
        </h2>

        <a th:href="@{/tipos/nuevo}"
           class="btn btn-success mb-3">
            Agregar Tipo de Servicio
        </a>

        <div th:if="${mensaje}"
             class="alert alert-success"
             th:text="${mensaje}">
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-bordered">

                <thead class="table-success">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Cantidad de Servicios</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="tipo : ${tipos}">

                        <td th:text="${tipo.id}"></td>

                        <td th:text="${tipo.nombre}"></td>

                        <td th:text="${tipo.descripcion}"></td>

                        <td th:text="${tipo.servicios.size()}"></td>

                        <td>
                            <a class="btn btn-warning btn-sm"
                               th:href="@{/tipos/editar(id=${tipo.id})}">
                                Editar
                            </a>

                            <button type="button"
                                    class="btn btn-danger btn-sm"
                                    data-bs-toggle="modal"
                                    th:attr="data-bs-target='#eliminarTipo' + ${tipo.id}">
                                Eliminar
                            </button>

                            <!-- MODAL -->
                            <div class="modal fade"
                                 th:id="'eliminarTipo' + ${tipo.id}"
                                 tabindex="-1">

                                <div class="modal-dialog">
                                    <div class="modal-content">

                                        <div class="modal-header">
                                            <h5 class="modal-title">
                                                Confirmar eliminación
                                            </h5>

                                            <button type="button"
                                                    class="btn-close"
                                                    data-bs-dismiss="modal">
                                            </button>
                                        </div>

                                        <div class="modal-body">
                                            ¿Desea eliminar el tipo de servicio
                                            <strong th:text="${tipo.nombre}"></strong>?
                                        </div>

                                        <div class="modal-footer">

                                            <button type="button"
                                                    class="btn btn-secondary"
                                                    data-bs-dismiss="modal">
                                                Cancelar
                                            </button>

                                            <form th:action="@{/tipos/eliminar}"
                                                  method="post">

                                                <input type="hidden"
                                                       name="id"
                                                       th:value="${tipo.id}">

                                                <button type="submit"
                                                        class="btn btn-danger">
                                                    Eliminar
                                                </button>
                                            </form>

                                        </div>
                                    </div>
                                </div>
                            </div>

                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <div th:replace="~{plantilla :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
