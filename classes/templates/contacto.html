
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contacto - Veterinaria Huellitas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- HEADER -->
    <div th:replace="~{plantilla :: header}"></div>

    <!-- NAVBAR -->
    <div th:replace="~{plantilla :: navbar}"></div>

    <main class="container mt-5">

        <h2 class="text-success mb-4">
            Contáctenos
        </h2>

        <p>
            Complete el siguiente formulario para
            solicitar información sobre nuestros
            servicios veterinarios.
        </p>

        <!-- MENSAJE DE AGRADECIMIENTO -->
        <div th:if="${mensaje}"
             class="alert alert-success"
             th:text="${mensaje}">
        </div>

        <div class="card shadow">

            <div class="card-header bg-success text-white">
                <h4 class="mb-0">
                    Formulario de Contacto
                </h4>
            </div>

            <div class="card-body">

                <form th:action="@{/contacto/enviar}"
                      method="post">

                    <!-- NOMBRE -->
                    <div class="mb-3">

                        <label for="nombre" class="form-label">
                            Nombre completo
                        </label>

                        <input type="text"
                               class="form-control"
                               id="nombre"
                               name="nombre"
                               maxlength="100"
                               required>

                    </div>

                    <!-- CORREO -->
                    <div class="mb-3">

                        <label for="correo" class="form-label">
                            Correo electrónico
                        </label>

                        <input type="email"
                               class="form-control"
                               id="correo"
                               name="correo"
                               maxlength="150"
                               required>

                    </div>

                    <!-- MASCOTA -->
                    <div class="mb-3">

                        <label for="mascota" class="form-label">
                            Nombre de la mascota
                        </label>

                        <input type="text"
                               class="form-control"
                               id="mascota"
                               name="mascota"
                               maxlength="100"
                               required>

                    </div>

                    <!-- MENSAJE -->
                    <div class="mb-3">

                        <label for="mensaje" class="form-label">
                            Mensaje
                        </label>

                        <textarea class="form-control"
                                  id="mensaje"
                                  name="mensaje"
                                  rows="5"
                                  required></textarea>

                    </div>

                    <!-- BOTONES -->
                    <button type="submit"
                            class="btn btn-success">
                        Enviar Mensaje
                    </button>

                    <a th:href="@{/}"
                       class="btn btn-secondary">
                        Volver al Inicio
                    </a>

                </form>

            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <div th:replace="~{plantilla :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
