
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Servicios Veterinarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- HEADER -->
    <div th:replace="~{plantilla :: header}"></div>

    <!-- NAVBAR -->
    <div th:replace="~{plantilla :: navbar}"></div>

    <main class="container mt-5">

        <h2 class="text-success mb-4">
            Servicios Veterinarios
        </h2>

        <a th:href="@{/servicios/nuevo}"
           class="btn btn-success mb-3">
            Agregar Servicio
        </a>

        <!-- MENSAJE -->
        <div th:if="${mensaje}"
             class="alert alert-success"
             th:text="${mensaje}">
        </div>

        <!-- TABLA -->
        <div class="table-responsive">

            <table class="table table-striped table-bordered">

                <thead class="table-success">
                    <tr>
                        <th>Nombre</th>
                        <th>Tipo de Servicio</th>
                        <th>Precio</th>
                        <th>Duración</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="servicio : ${servicios}">

                        <td th:text="${servicio.nombre}"></td>

                        <td th:text="${servicio.tipoServicio.nombre}"></td>

                        <td th:text="${servicio.precio}"></td>

                        <td th:text="${servicio.duracionMinutos + ' minutos'}"></td>

                        <td>

                            <a class="btn btn-warning btn-sm"
                               th:href="@{/servicios/editar(id=${servicio.id})}">
                                Editar
                            </a>

                            <button type="button"
                                    class="btn btn-danger btn-sm"
                                    data-bs-toggle="modal"
                                    th:attr="data-bs-target='#eliminarServicio' + ${servicio.id}">
                                Eliminar
                            </button>

                            <!-- MODAL DE ELIMINACIÓN -->
                            <div class="modal fade"
                                 th:id="'eliminarServicio' + ${servicio.id}"
                                 tabindex="-1">

                                <div class="modal-dialog">

                                    <div class="modal-content">

                                        <div class="modal-header">

                                            <h5 class="modal-title">
                                                Confirmar eliminación
                                            </h5>

                                            <button type="button"
                                                    class="btn-close"
                                                    data-bs-dismiss="modal">
                                            </button>

                                        </div>

                                        <div class="modal-body">

                                            ¿Desea eliminar el servicio

                                            <strong th:text="${servicio.nombre}">
                                            </strong>?

                                        </div>

                                        <div class="modal-footer">

                                            <button type="button"
                                                    class="btn btn-secondary"
                                                    data-bs-dismiss="modal">
                                                Cancelar
                                            </button>

                                            <form th:action="@{/servicios/eliminar}"
                                                  method="post">

                                                <input type="hidden"
                                                       name="id"
                                                       th:value="${servicio.id}">

                                                <button type="submit"
                                                        class="btn btn-danger">
                                                    Eliminar
                                                </button>

                                            </form>

                                        </div>

                                    </div>

                                </div>

                            </div>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

    <!-- FOOTER -->
    <div th:replace="~{plantilla :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
