
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Formulario de Servicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- HEADER -->
    <div th:replace="~{plantilla :: header}"></div>

    <!-- NAVBAR -->
    <div th:replace="~{plantilla :: navbar}"></div>

    <main class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-success text-white">

                <h3 class="mb-0"
                    th:text="${servicio.id == null}
                    ? 'Agregar Servicio Veterinario'
                    : 'Editar Servicio Veterinario'">
                </h3>

            </div>

            <div class="card-body">

                <form th:action="@{/servicios/guardar}"
                      th:object="${servicio}"
                      method="post">

                    <input type="hidden"
                           th:field="*{id}">

                    <!-- NOMBRE -->
                    <div class="mb-3">

                        <label class="form-label">
                            Nombre del Servicio
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{nombre}"
                               maxlength="100"
                               required>

                    </div>

                    <!-- TIPO -->
                    <div class="mb-3">

                        <label class="form-label">
                            Tipo de Servicio
                        </label>

                        <select class="form-select"
                                th:field="*{tipoServicio.id}"
                                required>

                            <option value="">
                                Seleccione un tipo
                            </option>

                            <option th:each="tipo : ${tipos}"
                                    th:value="${tipo.id}"
                                    th:text="${tipo.nombre}">
                            </option>

                        </select>

                    </div>

                    <!-- PRECIO -->
                    <div class="mb-3">

                        <label class="form-label">
                            Precio
                        </label>

                        <input type="number"
                               class="form-control"
                               th:field="*{precio}"
                               min="0"
                               step="0.01"
                               required>

                    </div>

                    <!-- DURACIÓN -->
                    <div class="mb-3">

                        <label class="form-label">
                            Duración en minutos
                        </label>

                        <input type="number"
                               class="form-control"
                               th:field="*{duracionMinutos}"
                               min="1"
                               required>

                    </div>

                    <!-- BOTONES -->
                    <button type="submit"
                            class="btn btn-success">
                        Guardar
                    </button>

                    <a th:href="@{/servicios/listado}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                </form>

            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <div th:replace="~{plantilla :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
