
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Formulario Tipo de Servicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div th:replace="~{plantilla :: header}"></div>
    <div th:replace="~{plantilla :: navbar}"></div>

    <main class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-success text-white">

                <h3 class="mb-0"
                    th:text="${tipoServicio.id == null}
                    ? 'Agregar Tipo de Servicio'
                    : 'Editar Tipo de Servicio'">
                </h3>

            </div>

            <div class="card-body">

                <form th:action="@{/tipos/guardar}"
                      th:object="${tipoServicio}"
                      method="post">

                    <input type="hidden"
                           th:field="*{id}">

                    <div class="mb-3">

                        <label class="form-label">
                            Nombre
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{nombre}"
                               maxlength="100"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Descripción
                        </label>

                        <textarea class="form-control"
                                  th:field="*{descripcion}"
                                  maxlength="255"
                                  rows="3">
                        </textarea>

                    </div>

                    <button type="submit"
                            class="btn btn-success">
                        Guardar
                    </button>

                    <a th:href="@{/tipos/listado}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                </form>

            </div>
        </div>

    </main>

    <div th:replace="~{plantilla :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
