
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Clínica Veterinaria</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- HEADER -->
    <header th:fragment="header"
            class="bg-success text-white text-center p-4">

        <h1 th:text="#{plantilla.titulo}">
            Clínica Veterinaria
        </h1>

        <p th:text="#{plantilla.subtitulo}">
            Cuidamos a tus mascotas
        </p>

    </header>

    <!-- NAVBAR -->
    <nav th:fragment="navbar"
         class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand"
               th:href="@{/}"
               th:text="#{plantilla.nombre}">
                Veterinaria
            </a>

            <div class="navbar-nav">

                <a class="nav-link"
                   th:href="@{/}"
                   th:text="#{menu.inicio}">
                    Inicio
                </a>

                <a class="nav-link"
                   th:href="@{/tipos/listado}"
                   th:text="#{menu.tipos}">
                    Tipos de Servicio
                </a>

                <a class="nav-link"
                   th:href="@{/servicios/listado}"
                   th:text="#{menu.servicios}">
                    Servicios
                </a>

                <a class="nav-link"
                   th:href="@{/citas/listado}"
                   th:text="#{menu.citas}">
                    Citas
                </a>

                <a class="nav-link"
                   th:href="@{/contacto}"
                   th:text="#{menu.contacto}">
                    Contacto
                </a>

            </div>
        </div>
    </nav>

    <!-- FOOTER -->
    <footer th:fragment="footer"
            class="bg-dark text-white text-center p-3 mt-5">

        <p class="mb-0"
           th:text="#{plantilla.footer}">
            Clínica Veterinaria
        </p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
