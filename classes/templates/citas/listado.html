
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Citas Programadas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- HEADER -->
    <div th:replace="~{plantilla :: header}"></div>

    <!-- NAVBAR -->
    <div th:replace="~{plantilla :: navbar}"></div>

    <main class="container mt-5">

        <h2 class="text-success mb-4">
            Citas Programadas
        </h2>

        <p class="text-muted">
            Consulte las próximas citas registradas
            en nuestra clínica veterinaria.
        </p>

        <!-- MENSAJE SI NO HAY CITAS -->
        <div th:if="${#lists.isEmpty(citas)}"
             class="alert alert-info">
            No hay citas programadas.
        </div>

        <!-- TABLA DE CITAS -->
        <div class="table-responsive"
             th:unless="${#lists.isEmpty(citas)}">

            <table class="table table-striped table-bordered">

                <thead class="table-success">
                    <tr>
                        <th>Mascota</th>
                        <th>Propietario</th>
                        <th>Fecha</th>
                        <th>Servicio Veterinario</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="cita : ${citas}">

                        <td th:text="${cita.nombreMascota}">
                        </td>

                        <td th:text="${cita.nombrePropietario}">
                        </td>

                        <td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}">
                        </td>

                        <td th:text="${cita.servicio.nombre}">
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

    <!-- FOOTER -->
    <div th:replace="~{plantilla :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
